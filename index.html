<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inscrições Rebanhão - Crescimento</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

<style>
/* ─── TOKENS ──────────────────────────────────────── */
:root {
  --font-body: 'DM Sans', sans-serif;
  --font-display: 'DM Serif Display', serif;

  /* Fundos neutros/escuros (sem o tom azulado de antes) */
  --bg-0: #121212;
  --bg-1: #18181b;
  --bg-2: #27272a;
  --bg-3: #3f3f46;
  --bg-glass: rgba(24, 24, 27, 0.85);

  --border-0: rgba(255,255,255,.05);
  --border-1: rgba(255,255,255,.10);
  --border-2: rgba(255,255,255,.15);

  --text-0: #f4f4f5;
  --text-1: #a1a1aa;
  --text-2: #71717a;

  /* Cores de Destaque (Tema Amarelo) */
  --accent-y: #FACC15; /* Amarelo Principal */
  --accent-y-dim: rgba(250, 204, 21, 0.12);
  --accent-y-mid: rgba(250, 204, 21, 0.25);
  
  --accent-o: #FB923C; /* Laranja para Pendentes/Medicação */
  --accent-o-dim: rgba(251, 146, 60, 0.12);
  
  --accent-r: #EF4444; /* Vermelho para Restrições */
  --accent-r-dim: rgba(239, 68, 68, 0.12);
  
  --accent-l: #FEF08A; /* Amarelo Claro para tag de Foto */
  --accent-l-dim: rgba(254, 240, 138, 0.12);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;

  --shadow-card: 0 2px 16px rgba(0,0,0,.35);
  --shadow-modal: 0 24px 80px rgba(0,0,0,.7);
  --transition: 0.2s cubic-bezier(.4,0,.2,1);
}

* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  -webkit-tap-highlight-color: transparent; 
  touch-action: manipulation; /* Trava o zoom por clique duplo */
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg-0);
  color: var(--text-0);
  font-family: var(--font-body);
  font-size: 15px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── LAYOUT ──────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .sidebar.mobile-open { display: flex; position: fixed; inset: 0; z-index: 500; }
}

/* ─── SIDEBAR ─────────────────────────────────────── */
.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--border-0);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}

.sidebar-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border-0);
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.sidebar-logo-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-y), #EAB308);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  color: #18181b;
}

.sidebar-logo-text {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--text-0);
  line-height: 1.1;
}

.sidebar-logo-sub {
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: .5px;
  text-transform: uppercase;
  font-weight: 500;
  margin-top: 3px;
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat-card {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  border-radius: var(--radius-md);
  padding: 12px 14px;
}

.stat-label {
  font-size: 10px;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: .8px;
  font-weight: 600;
  margin-bottom: 4px;
}

.stat-number {
  font-size: 28px;
  font-weight: 300;
  font-family: var(--font-display);
  color: var(--text-0);
  line-height: 1;
}

.stat-number.yellow { color: var(--accent-y); }
.stat-number.orange { color: var(--accent-o); }

.sidebar-body { padding: 20px 24px; flex: 1; overflow-y: auto; }

/* Search & Filter */
.search-field {
  position: relative;
  margin-bottom: 10px;
}

.search-field input {
  width: 100%;
  height: 42px;
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-sm);
  color: var(--text-0);
  font-family: var(--font-body);
  font-size: 14px;
  padding: 0 12px 0 40px;
  outline: none;
  transition: border-color var(--transition);
}

.search-field input:focus { border-color: var(--border-2); }
.search-field input::placeholder { color: var(--text-2); }

.search-icon {
  position: absolute;
  left: 13px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-2);
  font-size: 15px;
  pointer-events: none;
}

/* Filtros com quebra de linha (Wrap) para caber os 5 */
.filter-row { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 6px; 
}

.filter-chip {
  flex: 1;
  min-width: 65px; /* Garante que os botões não fiquem pequenos demais */
  height: 36px;
  border: 1px solid var(--border-1);
  border-radius: 20px;
  background: transparent;
  color: var(--text-1);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  padding: 0 8px;
}

.filter-chip.active-yellow {
  background: var(--accent-y-dim);
  border-color: var(--accent-y);
  color: var(--accent-y);
}

.filter-chip.active-orange {
  background: var(--accent-o-dim);
  border-color: var(--accent-o);
  color: var(--accent-o);
}

.filter-chip.active-red {
  background: var(--accent-r-dim);
  border-color: var(--accent-r);
  color: var(--accent-r);
}

.sidebar-divider {
  height: 1px;
  background: var(--border-0);
  margin: 16px 0;
}

.sidebar-section-title {
  font-size: 10px;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  margin-bottom: 8px;
}

.sidebar-counter {
  font-size: 12px;
  color: var(--text-1);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-count-val {
  font-weight: 600;
  color: var(--text-0);
}

.refresh-btn-side {
  width: 100%;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  color: var(--text-1);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all var(--transition);
  margin-top: auto;
}

.refresh-btn-side:hover { background: var(--bg-3); border-color: var(--border-2); color: var(--text-0); }

/* ─── MAIN CONTENT ────────────────────────────────── */
.main {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow: hidden;
}

/* Mobile topbar */
.mobile-topbar {
  display: none;
  padding: 16px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border-0);
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

@media (max-width: 900px) {
  .mobile-topbar { display: flex; }
}

.mobile-menu-btn {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  color: var(--text-0);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  cursor: pointer;
}

.mobile-title {
  font-family: var(--font-display);
  font-size: 18px;
  flex: 1;
}

.mobile-refresh {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  color: var(--text-1);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  cursor: pointer;
}

/* Mobile stats */
.mobile-stats {
  display: none;
  padding: 12px 16px;
  gap: 8px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border-0);
  overflow-x: auto;
}

.mobile-stats::-webkit-scrollbar { display: none; }

@media (max-width: 900px) {
  .mobile-stats { display: flex; }
}

.mobile-stat {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  min-width: max-content;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.mobile-stat-label { font-size: 9px; color: var(--text-2); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
.mobile-stat-number { font-size: 20px; font-weight: 300; font-family: var(--font-display); color: var(--text-0); line-height: 1; }
.mobile-stat-number.yellow { color: var(--accent-y); }
.mobile-stat-number.orange { color: var(--accent-o); }

/* Mobile search */
.mobile-search {
  display: none;
  padding: 12px 16px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border-0);
  gap: 8px;
}

@media (max-width: 900px) {
  .mobile-search { display: flex; }
}

.mobile-search .search-field { flex: 1; margin: 0; }

/* ─── LIST ────────────────────────────────────────── */
.list-wrapper {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

@media (max-width: 600px) {
  .list-wrapper { padding: 12px; }
}

/* Desktop 2-col grid */
@media (min-width: 1400px) {
  .list-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
}

.card {
  background: var(--bg-1);
  border: 1px solid var(--border-0);
  border-radius: var(--radius-lg);
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
  overflow: hidden;
}

@media (min-width: 1400px) {
  .card { margin-bottom: 0; }
}

.card:hover {
  border-color: var(--border-1);
  box-shadow: var(--shadow-card);
}

.card:active { transform: scale(0.992); }

.card-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
}

/* ─── AVATAR ──────────────────────────────────────── */
.avatar {
  width: 52px; height: 52px;
  border-radius: var(--radius-md);
  flex-shrink: 0;
  overflow: hidden;
  background: linear-gradient(135deg, #3f3314, #5c4a17);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 600; color: var(--accent-y);
  border: 1px solid var(--border-1);
  cursor: pointer;
  transition: opacity var(--transition);
  position: relative;
}

.avatar:hover { opacity: .85; }

.avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

.avatar .photo-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity var(--transition);
  font-size: 20px;
}

.avatar:hover .photo-overlay { opacity: 1; }

.card-info { flex: 1; min-width: 0; }

.card-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-0);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-email {
  font-size: 12px;
  color: var(--text-1);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-chips {
  display: flex;
  gap: 5px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2px;
}

.chip-yellow { background: var(--accent-y-dim); color: var(--accent-y); border: 1px solid var(--accent-y-mid); }
.chip-orange { background: var(--accent-o-dim); color: var(--accent-o); border: 1px solid rgba(251,146,60,.25); }
.chip-red { background: var(--accent-r-dim); color: var(--accent-r); border: 1px solid rgba(239,68,68,.2); }
.chip-light { background: var(--accent-l-dim); color: var(--accent-l); border: 1px solid rgba(254,240,138,.2); }
.chip-gray { background: rgba(255,255,255,.06); color: var(--text-1); border: 1px solid var(--border-1); }

.dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
.dot-y { background: var(--accent-y); }
.dot-o { background: var(--accent-o); }

.card-arrow { color: var(--text-2); font-size: 20px; flex-shrink: 0; }

.card-footer {
  border-top: 1px solid var(--border-0);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,.15);
  font-size: 12px;
}

.card-footer-lbl { color: var(--text-2); }
.card-footer-val { color: var(--text-0); font-weight: 600; }
.card-footer-sep { color: var(--border-1); margin: 0 8px; }

.empty, .loading {
  text-align: center;
  padding: 64px 20px;
  color: var(--text-2);
  font-size: 14px;
}

.loading-spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border-1);
  border-top-color: var(--accent-y);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ─── MODAL ───────────────────────────────────────── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 800;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.modal-bg.open { display: flex; animation: fadein .2s; }

@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  width: 100%;
  max-width: 680px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: var(--shadow-modal);
  animation: slideup .28s cubic-bezier(.4,0,.2,1);
}

@keyframes slideup { from { transform: translateY(48px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@media (min-width: 900px) {
  .modal-bg {
    align-items: center;
  }
  .modal {
    border-radius: var(--radius-xl);
    max-height: 88vh;
  }
}

.modal::-webkit-scrollbar { width: 4px; }
.modal::-webkit-scrollbar-track { background: transparent; }
.modal::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: 2px; }

.modal-head {
  padding: 20px;
  border-bottom: 1px solid var(--border-0);
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  z-index: 10;
}

.modal-avatar {
  width: 52px; height: 52px;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: linear-gradient(135deg, #3f3314, #5c4a17);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 600; color: var(--accent-y);
  flex-shrink: 0;
  border: 1px solid var(--border-1);
}

.modal-avatar img { width: 100%; height: 100%; object-fit: cover; }

.modal-head-info { flex: 1; min-width: 0; }
.modal-name { font-size: 17px; font-weight: 600; }
.modal-sub { font-size: 12px; color: var(--text-1); margin-top: 2px; }

.close-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-1);
  font-size: 16px;
  transition: all var(--transition);
  flex-shrink: 0;
}

.close-btn:hover { background: var(--bg-3); color: var(--text-0); }

.modal-body { padding: 20px; }

/* Sections */
.section {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 12px;
}

.section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-2);
  font-weight: 600;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-0);
  background: rgba(0,0,0,.15);
}

.section-body { padding: 16px; }

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

@media (max-width: 480px) {
  .grid-2 { grid-template-columns: 1fr; gap: 10px; }
}

.data-item .lbl {
  font-size: 11px;
  color: var(--text-2);
  margin-bottom: 3px;
  font-weight: 500;
}

.data-item .val {
  font-size: 14px;
  color: var(--text-0);
  font-weight: 500;
  line-height: 1.4;
}

.sacr-wrap { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }

/* ─── FOTO SECTION ────────────────────────────────── */
.foto-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.foto-preview-wrap {
  width: 100%;
  max-width: 240px;
  aspect-ratio: 1/1;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border-1);
  background: var(--bg-3);
  position: relative;
  cursor: pointer;
}

.foto-preview-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .3s;
}

.foto-preview-wrap:hover img { transform: scale(1.04); }

.foto-preview-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  opacity: 0;
  transition: opacity var(--transition);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
}

.foto-preview-wrap:hover .foto-preview-overlay { opacity: 1; }

.foto-empty {
  width: 100%;
  max-width: 240px;
  aspect-ratio: 1/1;
  border-radius: var(--radius-md);
  border: 2px dashed var(--border-1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-2);
  font-size: 13px;
  background: rgba(255,255,255,.02);
}

.foto-empty-icon { font-size: 36px; opacity: .4; }

.foto-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 300px; }

.foto-btn {
  height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-1);
  background: var(--bg-3);
  color: var(--text-0);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all var(--transition);
}

.foto-btn:hover { background: var(--bg-2); border-color: var(--border-2); }

/* ─── PAYMENT TOGGLE ──────────────────────────────── */
.payment-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-1);
  overflow: hidden;
  margin-top: 4px;
}

.payment-opt {
  height: 48px;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text-2);
  background: transparent;
  transition: all var(--transition);
  border: none;
  font-family: var(--font-body);
}

.payment-opt + .payment-opt { border-left: 1px solid var(--border-1); }

.payment-opt.sel-yellow {
  background: var(--accent-y-dim);
  color: var(--accent-y);
}

.payment-opt.sel-orange {
  background: var(--accent-o-dim);
  color: var(--accent-o);
}

/* ─── SAVE BUTTON ─────────────────────────────────── */
.save-btn {
  width: 100%;
  height: 52px;
  background: linear-gradient(135deg, var(--accent-y), #EAB308);
  color: #18181b; /* Texto escuro para contrastar no amarelo */
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 16px;
  transition: opacity var(--transition), transform var(--transition);
  letter-spacing: .2px;
}

.save-btn:hover { opacity: .9; }

/* ─── LIGHTBOX ────────────────────────────────────── */

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
// ============================================================
// CONFIG — Troque pela URL da sua API do Google Apps Script
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwX87QCGUQg6jO5Cx1R-TZAY8_-W9q6e2YwX4ZWdJHHWjDkdhsP5JVXVBrM3Yb1MUE-/exec";

// ============================================================
// STATE
// ============================================================
let dados = [], filtrados = [];
let iP = 18, iF = 19;
let rowAtual = -1;
let filtroAtivo = null; // 'pago' | 'pend' | 'foto' | 'med' | 'rest' | null
let fotoNovaBase64 = null, fotoNovoMime = null, fotoNovoNome = null;
let cropper = null;
let _pagoSelecionado = true;

// ============================================================
// UTILS
// ============================================================
function initials(n) {
  const p = (n || "?").trim().split(" ");
  return p.length >= 2 ? (p[0][0] + p[p.length-1][0]).toUpperCase() : (p[0][0] || "?").toUpperCase();
}

// Converte qualquer URL do Google Drive para formato que pode ser exibido em <img>
function fixDriveUrl(url) {
  if (!url || !url.trim()) return "";
  url = url.trim();

  // Já é lh3.googleusercontent.com — retorna direto
  if (url.includes("lh3.googleusercontent.com")) return url;

  // /file/d/{id}/view  ou  open?id={id}  ou  uc?export=view&id={id}
  let id = null;

  const m1 = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  if (m1) id = m1[1];

  if (!id) {
    const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if (m2) id = m2[1];
  }

  if (id) return `https://lh3.googleusercontent.com/d/${id}`;

  // Fallback: retorna a URL original
  return url;
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = "") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove("show"), 3000);
}

// ============================================================
// SIDEBAR MOBILE
// ============================================================
function openSidebar() {
  document.getElementById("sidebar").classList.add("mobile-open");
  document.getElementById("sidebarOverlay").classList.add("open");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("mobile-open");
  document.getElementById("sidebarOverlay").classList.remove("open");
}

// ============================================================
// LOAD DATA
// ============================================================
async function carregarDados() {
  document.getElementById("lista").innerHTML = `
    <div class="loading">
      <div class="loading-spinner"></div>
      Carregando dados da planilha…
    </div>`;

  try {
    const res = await fetch(API_URL);
    const json = await res.text();
    renderizar(json);
  } catch (err) {
    console.error(err);
    document.getElementById("lista").innerHTML = `<div class="empty">Erro de conexão. Tente novamente.</div>`;
  }
}

function renderizar(json) {
  const data = JSON.parse(json);
  dados = data.slice(1);
  const h = data[0];
  iP = h.indexOf("PAGO");
  iF = h.indexOf("Foto");
  filtrados = [...dados];
  atualizarStats();
  renderLista();
}

function atualizarStats() {
  const t = dados.length;
  const pg = dados.filter(r => (r[iP] || "").toUpperCase() === "SIM").length;
  const cf = dados.filter(r => r[iF] && r[iF].trim()).length;

  // Sidebar stats
  document.getElementById("sTotal").textContent = t;
  document.getElementById("sPagos").textContent = pg;
  document.getElementById("sPend").textContent = t - pg;
  document.getElementById("sFoto").textContent = cf;

  // Mobile stats
  document.getElementById("mTotal").textContent = t;
  document.getElementById("mPagos").textContent = pg;
  document.getElementById("mPend").textContent = t - pg;
  document.getElementById("mFoto").textContent = cf;
}

// ============================================================
// FILTER
// ============================================================
function toggleFiltro(tipo) {
  filtroAtivo = filtroAtivo === tipo ? null : tipo;

  // Reset chips
  ["chipPago","chipPend","chipFoto","chipMed","chipRest"].forEach(id => {
    document.getElementById(id).className = "filter-chip";
  });

  if (filtroAtivo === "pago") document.getElementById("chipPago").className = "filter-chip active-yellow";
  if (filtroAtivo === "pend") document.getElementById("chipPend").className = "filter-chip active-orange";
  if (filtroAtivo === "foto") document.getElementById("chipFoto").className = "filter-chip active-yellow";
  if (filtroAtivo === "med") document.getElementById("chipMed").className = "filter-chip active-orange";
  if (filtroAtivo === "rest") document.getElementById("chipRest").className = "filter-chip active-red";

  filtrar();
}

function toggleFiltroMobile() {
  // Cicla entre todas as opções
  const order = [null, "pend", "pago", "foto", "med", "rest"];
  let idx = order.indexOf(filtroAtivo);
  idx = (idx + 1) % order.length;
  filtroAtivo = order[idx];

  const chip = document.getElementById("chipMobile");
  chip.className = "filter-chip"; // Reset

  if (!filtroAtivo) { chip.textContent = "Filtrar"; }
  else if (filtroAtivo === "pend") { chip.textContent = "Pendente"; chip.classList.add("active-orange"); }
  else if (filtroAtivo === "pago") { chip.textContent = "Pago"; chip.classList.add("active-yellow"); }
  else if (filtroAtivo === "foto") { chip.textContent = "Com Foto"; chip.classList.add("active-yellow"); }
  else if (filtroAtivo === "med") { chip.textContent = "Medicação"; chip.classList.add("active-orange"); }
  else if (filtroAtivo === "rest") { chip.textContent = "Restrição"; chip.classList.add("active-red"); }

  filtrar();
}

function filtrarMobile() {
  document.getElementById("busca").value = document.getElementById("buscaMobile").value;
  filtrar();
}

function filtrar() {
  const q = (document.getElementById("busca").value || "").toLowerCase();
  filtrados = dados.filter(r => {
    const n = (r[2] || "").toLowerCase(), e = (r[1] || "").toLowerCase();
    const mq = !q || n.includes(q) || e.includes(q);
    
    const pago = (r[iP] || "").toUpperCase() === "SIM";
    const foto = !!(r[iF] && r[iF].trim());
    const rest = (r[7] || "").toLowerCase().includes("sim");
    const med = (r[9] || "").toLowerCase().includes("sim");
    
    let mp = true;
    if (filtroAtivo === "pago") mp = pago;
    if (filtroAtivo === "pend") mp = !pago;
    if (filtroAtivo === "foto") mp = foto;
    if (filtroAtivo === "med") mp = med;
    if (filtroAtivo === "rest") mp = rest;
    
    return mq && mp;
  });
  document.getElementById("sCount").textContent = filtrados.length;
  renderLista();
}

// ============================================================
// RENDER LIST
// ============================================================
function renderLista() {
  document.getElementById("sCount").textContent = filtrados.length;

  if (!filtrados.length) {
    document.getElementById("lista").innerHTML = `<div class="empty">Nenhum participante encontrado.</div>`;
    return;
  }

  let html = "";
  filtrados.forEach(row => {
    const ri = dados.indexOf(row);
    const nome = row[2] || "—";
    const email = row[1] || "";
    const nasc = row[4] || "—";
    const resp = row[5] || "—";
    const pago = (row[iP] || "").toUpperCase() === "SIM";
    const fotoRaw = row[iF] || "";
    const foto = fixDriveUrl(fotoRaw);
    const rest = (row[7] || "").toLowerCase().includes("sim");
    const med = (row[9] || "").toLowerCase().includes("sim");
    const ini = initials(nome);

    const pgChip = pago
      ? `<span class="chip chip-yellow"><span class="dot dot-y"></span>Pago</span>`
      : `<span class="chip chip-orange"><span class="dot dot-o"></span>Pendente</span>`;
    const rChip = rest ? `<span class="chip chip-red">Restrição</span>` : "";
    const mChip = med ? `<span class="chip chip-orange">Medicação</span>` : "";
    const fChip = foto ? `<span class="chip chip-light">✓ Foto</span>` : "";

    const avInner = foto
      ? `<img src="${foto}" onerror="this.onerror=null;this.parentElement.innerHTML='<span>${ini}</span>'"><div class="photo-overlay">🔍</div>`
      : `<span>${ini}</span>`;

    html += `
      <div class="card" onclick="abrirModal(${ri})">
        <div class="card-inner">
          <div class="avatar" onclick="event.stopPropagation(); ${foto ? `verFoto('${foto}')` : ''}" title="${foto ? 'Ver foto' : nome}">
            ${avInner}
          </div>
          <div class="card-info">
            <div class="card-name">${nome}</div>
            <div class="card-email">${email}</div>
            <div class="card-chips">${pgChip}${rChip}${mChip}${fChip}</div>
          </div>
          <div class="card-arrow">›</div>
        </div>
        <div class="card-footer">
          <span class="card-footer-lbl">Nasc.</span>
          <span class="card-footer-val">${nasc}</span>
          <span class="card-footer-sep">|</span>
          <span class="card-footer-lbl">Resp.</span>
          <span class="card-footer-val" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${resp}</span>
        </div>
      </div>`;
  });

  document.getElementById("lista").innerHTML = html;
}

// ============================================================
// LIGHTBOX
// ============================================================
function verFoto(url) {
  if (!url) return;
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightboxBg").classList.add("open");
}

function fecharLightbox() {
  document.getElementById("lightboxBg").classList.remove("open");
}

// ============================================================
// MODAL PRINCIPAL
// ============================================================
function abrirModal(ri) {
  rowAtual = ri;
  fotoNovaBase64 = null; fotoNovoMime = null; fotoNovoNome = null;
  const row = dados[ri];
  const nome = row[2] || "—";
  const email = row[1] || "";
  const fotoRaw = row[iF] || "";
  const foto = fixDriveUrl(fotoRaw);
  const pago = (row[iP] || "").toUpperCase() === "SIM";
  _pagoSelecionado = pago;
  const ini = initials(nome);

  document.getElementById("mNome").textContent = nome;
  document.getElementById("mSub").textContent = email;

  const av = document.getElementById("mAvatar");
  av.innerHTML = foto
    ? `<img src="${foto}" onerror="this.onerror=null;this.parentElement.innerHTML='${ini}'">`
    : ini;

  const rest = (row[7] || "").toLowerCase().includes("sim");
  const med = (row[9] || "").toLowerCase().includes("sim");
  const alerMed = (row[11] || "").toLowerCase().includes("sim");
  const sair = (row[13] || "").toLowerCase().includes("sim");
  const sacrs = (row[16] || "—").split(",").map(s => s.trim()).filter(Boolean);
  const sacrHtml = sacrs.map(s => `<span class="chip chip-gray">${s}</span>`).join("");

  // Foto section
  let fotoHtml = "";
  if (foto) {
    fotoHtml = `
      <div class="foto-preview-wrap" onclick="verFoto('${foto}')" title="Clique para ampliar">
        <img id="fotoAtual" src="${foto}" onerror="this.onerror=null;this.parentElement.outerHTML=buildFotoEmpty()">
        <div class="foto-preview-overlay"><span style="font-size:28px">🔍</span><span>Ver foto completa</span></div>
      </div>`;
  } else {
    fotoHtml = `<div class="foto-empty" id="fotoEmpty"><div class="foto-empty-icon">📷</div><span>Nenhuma foto cadastrada</span></div>`;
  }

  document.getElementById("mBody").innerHTML = `
    <div class="section">
      <div class="section-title">Dados pessoais</div>
      <div class="section-body">
        <div class="grid-2">
          <div class="data-item"><div class="lbl">Nascimento</div><div class="val">${row[4] || "—"}</div></div>
          <div class="data-item"><div class="lbl">Telefone</div><div class="val">${row[3] || "—"}</div></div>
          <div class="data-item"><div class="lbl">Responsável</div><div class="val">${row[5] || "—"}</div></div>
          <div class="data-item"><div class="lbl">Tel. responsável</div><div class="val">${row[6] || "—"}</div></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Saúde e alimentação</div>
      <div class="section-body">
        <div class="grid-2">
          <div class="data-item"><div class="lbl">Restrição alimentar</div><div class="val">${rest ? "Sim — " + (row[8] || "") : "Não"}</div></div>
          <div class="data-item"><div class="lbl">Medicação</div><div class="val">${med ? "Sim — " + (row[10] || "") : "Não"}</div></div>
          <div class="data-item"><div class="lbl">Alergia a medicação</div><div class="val">${alerMed ? "Sim — " + (row[12] || "") : "Não"}</div></div>
          <div class="data-item"><div class="lbl">Precisará sair</div><div class="val">${sair ? "Sim — " + (row[14] || "") : "Não"}</div></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Histórico religioso</div>
      <div class="section-body">
        <div class="data-item" style="margin-bottom:12px"><div class="lbl">Já fez retiro</div><div class="val">${row[15] || "—"}</div></div>
        <div class="data-item"><div class="lbl">Sacramentos</div><div class="sacr-wrap">${sacrHtml}</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Foto do participante</div>
      <div class="section-body">
        <div class="foto-container">
          ${fotoHtml}
          <div class="foto-actions">
            <button class="foto-btn" onclick="abrirGaleria()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              Galeria
            </button>
            <button class="foto-btn" onclick="abrirCamera()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
              Câmera
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Status de pagamento</div>
      <div class="section-body">
        <div class="payment-toggle">
          <button class="payment-opt ${pago ? "sel-yellow" : ""}" id="optPago" onclick="setPago(true)">Pago</button>
          <button class="payment-opt ${pago ? "" : "sel-orange"}" id="optPend" onclick="setPago(false)">Pendente</button>
        </div>
        <button class="save-btn" id="saveBtn" onclick="salvar()">Salvar alterações</button>
      </div>
    </div>`;

  document.getElementById("modalBg").classList.add("open");
}

function fecharModal() {
  document.getElementById("modalBg").classList.remove("open");
}

function setPago(v) {
  _pagoSelecionado = v;
  document.getElementById("optPago").className = "payment-opt " + (v ? "sel-yellow" : "");
  document.getElementById("optPend").className = "payment-opt " + (v ? "" : "sel-orange");
}

// ============================================================
// FOTO — CROP
// ============================================================
function abrirGaleria() { document.getElementById("inputFotoGaleria").click(); }
function abrirCamera() { document.getElementById("inputFotoCamera").click(); }

function processarFoto(file) {
  if (!file) return;
  fotoNovoMime = file.type;
  fotoNovoNome = file.name;
  const reader = new FileReader();
  reader.onloadend = e => {
    document.getElementById("imageToCrop").src = e.target.result;
    document.getElementById("cropModalBg").classList.add("open");
    if (cropper) cropper.destroy();
    cropper = new Cropper(document.getElementById("imageToCrop"), {
      aspectRatio: 1,
      viewMode: 1,
      zoomable: true,
      dragMode: "move",
      autoCropArea: 1,
      guides: true,
      cropBoxMovable: true,
      cropBoxResizable: true,
      toggleDragModeOnDblclick: false,
    });
  };
  reader.readAsDataURL(file);
}

function fecharCrop() {
  document.getElementById("cropModalBg").classList.remove("open");
  if (cropper) { cropper.destroy(); cropper = null; }
}

function aplicarCrop() {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
  fotoNovaBase64 = canvas.toDataURL(fotoNovoMime || "image/jpeg", 0.9);

  // Atualiza preview no modal
  const container = document.querySelector("#mBody .section:nth-of-type(4) .foto-container");
  const oldPreview = container.querySelector(".foto-preview-wrap");
  const oldEmpty = container.querySelector(".foto-empty");
  if (oldPreview) oldPreview.remove();
  if (oldEmpty) oldEmpty.remove();

  const wrap = document.createElement("div");
  wrap.className = "foto-preview-wrap";
  wrap.title = "Clique para ampliar";
  wrap.onclick = () => verFoto(fotoNovaBase64);
  wrap.innerHTML = `
    <img id="fotoAtual" src="${fotoNovaBase64}">
    <div class="foto-preview-overlay"><span style="font-size:28px">🔍</span><span>Ver foto completa</span></div>`;

  const actions = container.querySelector(".foto-actions");
  container.insertBefore(wrap, actions);

  // Também atualiza o avatar do modal
  const av = document.getElementById("mAvatar");
  av.innerHTML = `<img src="${fotoNovaBase64}">`;

  fecharCrop();
  showToast("Foto recortada! Clique em Salvar para enviar.", "success");
}

document.getElementById("inputFotoGaleria").addEventListener("change", function() { processarFoto(this.files[0]); this.value = ""; });
document.getElementById("inputFotoCamera").addEventListener("change", function() { processarFoto(this.files[0]); this.value = ""; });

// ============================================================
// SAVE
// ============================================================
async function salvar() {
  const btn = document.getElementById("saveBtn");
  btn.textContent = "Salvando…";
  btn.disabled = true;

  const payload = {
    rowIndex: rowAtual,
    pago: _pagoSelecionado ? "SIM" : "NÃO",
    fotoBase64: fotoNovaBase64,
    mimeType: fotoNovoMime,
    nomeArquivo: fotoNovoNome
  };

  try {
    await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    showToast("Salvo com sucesso! ✓", "success");
    setTimeout(() => { fecharModal(); carregarDados(); }, 600);
  } catch (err) {
    console.error(err);
    showToast("Erro ao salvar. Tente novamente.", "error");
    btn.textContent = "Tentar novamente";
    btn.disabled = false;
  }
}

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    fecharLightbox();
    fecharModal();
    fecharCrop();
    closeSidebar();
  }
});

// ============================================================
// BLOQUEIO DE ZOOM NO IOS (Pinça e Toque Duplo)
// ============================================================
// Bloqueia o movimento de pinça (pinch-to-zoom)
document.addEventListener('touchmove', function(event) {
  if (event.touches.length > 1) {
    event.preventDefault();
  }
}, { passive: false });

// Bloqueia o zoom nativo extra por duplo toque rápido
let lastTouchEnd = 0;
document.addEventListener('touchend', function(event) {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, false);

// ============================================================
// INIT
// ============================================================
carregarDados();
</script>
</body>
</html>
