<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inscrições Rebanhão - Crescimento</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ──────────────────────────────────────── */
:root {
  --font-body: 'DM Sans', sans-serif;
  --font-display: 'DM Serif Display', serif;
  --bg-0: #121212;
  --bg-1: #18181b;
  --bg-2: #27272a;
  --bg-3: #3f3f46;
  --bg-glass: rgba(24,24,27,.85);
  --border-0: rgba(255,255,255,.05);
  --border-1: rgba(255,255,255,.10);
  --border-2: rgba(255,255,255,.15);
  --text-0: #f4f4f5;
  --text-1: #a1a1aa;
  --text-2: #71717a;
  --accent-y: #FACC15;
  --accent-y-dim: rgba(250,204,21,.12);
  --accent-y-mid: rgba(250,204,21,.25);
  --accent-o: #FB923C;
  --accent-o-dim: rgba(251,146,60,.12);
  --accent-r: #EF4444;
  --accent-r-dim: rgba(239,68,68,.12);
  --accent-l: #FEF08A;
  --accent-l-dim: rgba(254,240,138,.12);
  --accent-g: #4ADE80;
  --accent-g-dim: rgba(74,222,128,.12);
  --accent-g-mid: rgba(74,222,128,.25);
  --accent-b: #60A5FA;
  --accent-b-dim: rgba(96,165,250,.12);
  --accent-b-mid: rgba(96,165,250,.25);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --shadow-card: 0 2px 16px rgba(0,0,0,.35);
  --shadow-modal: 0 24px 80px rgba(0,0,0,.7);
  --transition: 0.2s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html{scroll-behavior:smooth;}
body{background:var(--bg-0);color:var(--text-0);font-family:var(--font-body);font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased;}
/* ─── LAYOUT ──────────────────────────────────────── */
.layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh;}
@media(max-width:900px){.layout{grid-template-columns:1fr;}.sidebar{display:none;}.sidebar.mobile-open{display:flex;position:fixed;inset:0;z-index:500;}}
/* ─── ENCONTRO BANNER ─────────────────────────────── */
.encontro-banner{padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-0);font-size:13px;}
.encontro-banner.active{background:rgba(74,222,128,.06);border-bottom-color:rgba(74,222,128,.2);}
.encontro-banner.inactive{background:rgba(251,146,60,.06);border-bottom-color:rgba(251,146,60,.2);}
.encontro-banner.none{background:rgba(255,255,255,.03);}
.encontro-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.encontro-dot.active{background:var(--accent-g);box-shadow:0 0 8px rgba(74,222,128,.6);}
.encontro-dot.inactive{background:var(--accent-o);}
.encontro-dot.none{background:var(--text-2);}
.encontro-info{flex:1;}
.encontro-name{font-weight:600;color:var(--text-0);}
.encontro-name.active{color:var(--accent-g);}
.encontro-name.inactive{color:var(--accent-o);}
.encontro-name.none{color:var(--text-2);}
.encontro-meta{font-size:11px;color:var(--text-2);margin-top:1px;}
/* ─── SIDEBAR ─────────────────────────────────────── */
.sidebar{background:var(--bg-1);border-right:1px solid var(--border-0);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;}
.sidebar-header{padding:28px 24px 20px;border-bottom:1px solid var(--border-0);}
.sidebar-logo{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.sidebar-logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent-y),#EAB308);display:flex;align-items:center;justify-content:center;font-size:20px;color:#18181b;}
.sidebar-logo-text{font-family:var(--font-display);font-size:20px;color:var(--text-0);line-height:1.1;}
.sidebar-logo-sub{font-size:11px;color:var(--text-2);letter-spacing:.5px;text-transform:uppercase;font-weight:500;margin-top:3px;}
/* Encontro ativo — sidebar */
.sidebar-encontro{margin-bottom:14px;padding:12px 14px;border-radius:var(--radius-md);border:1px solid var(--border-0);background:var(--bg-2);font-size:12px;}
.sidebar-encontro.enc-active{border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.06);}
.sidebar-encontro.enc-inactive{border-color:rgba(251,146,60,.25);background:rgba(251,146,60,.06);}
.sidebar-enc-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;color:var(--text-2);margin-bottom:5px;}
.sidebar-enc-label.active{color:var(--accent-g);}
.sidebar-enc-label.inactive{color:var(--accent-o);}
.sidebar-enc-name{font-size:14px;font-weight:600;color:var(--text-0);}
.sidebar-enc-date{font-size:11px;color:var(--text-2);margin-top:2px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-card{background:var(--bg-2);border:1px solid var(--border-0);border-radius:var(--radius-md);padding:12px 14px;}
.stat-card.full{grid-column:1 / -1;}
.stat-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:4px;}
.stat-number{font-size:28px;font-weight:300;font-family:var(--font-display);color:var(--text-0);line-height:1;}
.stat-number.yellow{color:var(--accent-y);}
.stat-number.orange{color:var(--accent-o);}
.stat-number.green{color:var(--accent-g);}
.sidebar-body{padding:20px 24px;flex:1;overflow-y:auto;}
.search-field{position:relative;margin-bottom:10px;}
.search-field input{width:100%;height:42px;background:var(--bg-2);border:1px solid var(--border-1);border-radius:var(--radius-sm);color:var(--text-0);font-family:var(--font-body);font-size:14px;padding:0 12px 0 40px;outline:none;transition:border-color var(--transition);}
.search-field input:focus{border-color:var(--border-2);}
.search-field input::placeholder{color:var(--text-2);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-2);font-size:15px;pointer-events:none;}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;}
.filter-chip{flex:1;min-width:65px;height:36px;border:1px solid var(--border-1);border-radius:20px;background:transparent;color:var(--text-1);font-family:var(--font-body);font-size:12px;font-weight:500;cursor:pointer;transition:all var(--transition);padding:0 8px;}
.filter-chip.active-yellow{background:var(--accent-y-dim);border-color:var(--accent-y);color:var(--accent-y);}
.filter-chip.active-orange{background:var(--accent-o-dim);border-color:var(--accent-o);color:var(--accent-o);}
.filter-chip.active-red{background:var(--accent-r-dim);border-color:var(--accent-r);color:var(--accent-r);}
.filter-chip.active-green{background:var(--accent-g-dim);border-color:var(--accent-g);color:var(--accent-g);}
.sidebar-divider{height:1px;background:var(--border-0);margin:16px 0;}
.sidebar-section-title{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px;}
.sidebar-counter{font-size:12px;color:var(--text-1);display:flex;align-items:center;justify-content:space-between;}
.sidebar-count-val{font-weight:600;color:var(--text-0);}
.refresh-btn-side{width:100%;height:40px;border-radius:var(--radius-sm);background:var(--bg-2);border:1px solid var(--border-1);color:var(--text-1);font-family:var(--font-body);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all var(--transition);margin-top:auto;}
.refresh-btn-side:hover{background:var(--bg-3);border-color:var(--border-2);color:var(--text-0);}
/* ─── MAIN ────────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-height:100vh;overflow:hidden;}
.mobile-topbar{display:none;padding:16px;background:var(--bg-1);border-bottom:1px solid var(--border-0);align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
@media(max-width:900px){.mobile-topbar{display:flex;}}
.mobile-menu-btn,.mobile-refresh{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--bg-2);border:1px solid var(--border-1);color:var(--text-0);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.mobile-refresh{color:var(--text-1);}
.mobile-title{font-family:var(--font-display);font-size:18px;flex:1;}
.mobile-stats{display:none;padding:12px 16px;gap:8px;background:var(--bg-1);border-bottom:1px solid var(--border-0);overflow-x:auto;}
.mobile-stats::-webkit-scrollbar{display:none;}
@media(max-width:900px){.mobile-stats{display:flex;}}
.mobile-stat{background:var(--bg-2);border:1px solid var(--border-0);border-radius:var(--radius-sm);padding:8px 14px;min-width:max-content;display:flex;flex-direction:column;gap:2px;}
.mobile-stat-label{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:.8px;font-weight:600;}
.mobile-stat-number{font-size:20px;font-weight:300;font-family:var(--font-display);color:var(--text-0);line-height:1;}
.mobile-stat-number.yellow{color:var(--accent-y);}
.mobile-stat-number.orange{color:var(--accent-o);}
.mobile-stat-number.green{color:var(--accent-g);}
.mobile-search{display:none;padding:12px 16px;background:var(--bg-1);border-bottom:1px solid var(--border-0);gap:8px;}
@media(max-width:900px){.mobile-search{display:flex;}}
.mobile-search .search-field{flex:1;margin:0;}
/* ─── LIST ────────────────────────────────────────── */
.list-wrapper{flex:1;overflow-y:auto;padding:20px;}
@media(max-width:600px){.list-wrapper{padding:12px;}}
@media(min-width:1400px){.list-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}}
.card{background:var(--bg-1);border:1px solid var(--border-0);border-radius:var(--radius-lg);margin-bottom:10px;cursor:pointer;transition:border-color var(--transition),box-shadow var(--transition),transform var(--transition);overflow:hidden;}
@media(min-width:1400px){.card{margin-bottom:0;}}
.card:hover{border-color:var(--border-1);box-shadow:var(--shadow-card);}
.card:active{transform:scale(0.992);}
.card.card-checkedin{border-color:rgba(74,222,128,.2);}
.card-inner{display:flex;align-items:center;gap:14px;padding:16px;}
/* ─── AVATAR ──────────────────────────────────────── */
.avatar{width:52px;height:52px;border-radius:var(--radius-md);flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,#3f3314,#5c4a17);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--accent-y);border:1px solid var(--border-1);cursor:pointer;transition:opacity var(--transition);position:relative;}
.avatar.avatar-checkedin{border-color:rgba(74,222,128,.4);}
.avatar:hover{opacity:.85;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.avatar .photo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--transition);font-size:20px;}
.avatar:hover .photo-overlay{opacity:1;}
.card-info{flex:1;min-width:0;}
.card-name{font-size:15px;font-weight:600;color:var(--text-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-email{font-size:12px;color:var(--text-1);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-chips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.2px;}
.chip-yellow{background:var(--accent-y-dim);color:var(--accent-y);border:1px solid var(--accent-y-mid);}
.chip-orange{background:var(--accent-o-dim);color:var(--accent-o);border:1px solid rgba(251,146,60,.25);}
.chip-red{background:var(--accent-r-dim);color:var(--accent-r);border:1px solid rgba(239,68,68,.2);}
.chip-light{background:var(--accent-l-dim);color:var(--accent-l);border:1px solid rgba(254,240,138,.2);}
.chip-gray{background:rgba(255,255,255,.06);color:var(--text-1);border:1px solid var(--border-1);}
.chip-green{background:var(--accent-g-dim);color:var(--accent-g);border:1px solid var(--accent-g-mid);}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;}
.dot-y{background:var(--accent-y);}
.dot-o{background:var(--accent-o);}
.dot-g{background:var(--accent-g);}
/* ─── CARD CHECK-IN ACTION ────────────────────────── */
.card-checkin-zone{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;}
.ci-action{width:44px;height:44px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all var(--transition);border:none;font-family:var(--font-body);}
.ci-action.ci-ready{background:var(--accent-g-dim);border:1px solid var(--accent-g-mid);color:var(--accent-g);}
.ci-action.ci-ready:hover{background:rgba(74,222,128,.22);transform:scale(1.06);}
.ci-action.ci-done{background:var(--accent-g-dim);border:1px solid var(--accent-g-mid);color:var(--accent-g);cursor:default;}
.ci-action.ci-nofoto{background:var(--accent-o-dim);border:1px solid rgba(251,146,60,.25);color:var(--accent-o);}
.ci-action.ci-nofoto:hover{background:rgba(251,146,60,.2);}
.ci-action.ci-locked{background:rgba(255,255,255,.04);border:1px solid var(--border-0);color:var(--text-2);cursor:default;}
.ci-label{font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;text-align:center;color:var(--text-2);}
.card-footer{border-top:1px solid var(--border-0);padding:10px 16px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.15);font-size:12px;}
.card-footer-lbl{color:var(--text-2);}
.card-footer-val{color:var(--text-0);font-weight:600;}
.card-footer-sep{color:var(--border-1);margin:0 8px;}
.empty,.loading{text-align:center;padding:64px 20px;color:var(--text-2);font-size:14px;}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border-1);border-top-color:var(--accent-y);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
/* ─── MODAL ───────────────────────────────────────── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:800;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.modal-bg.open{display:flex;animation:fadein .2s;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-modal);animation:slideup .28s cubic-bezier(.4,0,.2,1);}
@keyframes slideup{from{transform:translateY(48px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@media(min-width:900px){.modal-bg{align-items:center;}.modal{border-radius:var(--radius-xl);max-height:88vh;}}
.modal::-webkit-scrollbar{width:4px;}
.modal::-webkit-scrollbar-track{background:transparent;}
.modal::-webkit-scrollbar-thumb{background:var(--border-1);border-radius:2px;}
.modal-head{padding:20px;border-bottom:1px solid var(--border-0);display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--bg-glass);backdrop-filter:blur(12px);z-index:10;}
.modal-avatar{width:52px;height:52px;border-radius:var(--radius-md);overflow:hidden;background:linear-gradient(135deg,#3f3314,#5c4a17);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--accent-y);flex-shrink:0;border:1px solid var(--border-1);}
.modal-avatar img{width:100%;height:100%;object-fit:cover;}
.modal-head-info{flex:1;min-width:0;}
.modal-name{font-size:17px;font-weight:600;}
.modal-sub{font-size:12px;color:var(--text-1);margin-top:2px;}
.close-btn{width:36px;height:36px;border-radius:50%;background:var(--bg-2);border:1px solid var(--border-1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-1);font-size:16px;transition:all var(--transition);flex-shrink:0;}
.close-btn:hover{background:var(--bg-3);color:var(--text-0);}
.modal-body{padding:20px;}
.section{background:var(--bg-2);border:1px solid var(--border-0);border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px;}
.section.section-checkin{border-color:rgba(74,222,128,.2);}
.section.section-checkin-locked{border-color:rgba(251,146,60,.2);}
.section.section-checkin-nofoto{border-color:rgba(251,146,60,.2);}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-2);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border-0);background:rgba(0,0,0,.15);}
.section.section-checkin .section-title{color:var(--accent-g);}
.section.section-checkin-locked .section-title{color:var(--accent-o);}
.section-body{padding:16px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(max-width:480px){.grid-2{grid-template-columns:1fr;gap:10px;}}
.data-item .lbl{font-size:11px;color:var(--text-2);margin-bottom:3px;font-weight:500;}
.data-item .val{font-size:14px;color:var(--text-0);font-weight:500;line-height:1.4;}
.sacr-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
/* ─── CHECK-IN LOCKED ─────────────────────────────── */
.checkin-locked-banner{padding:14px 16px;background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.2);border-radius:var(--radius-sm);}
.checkin-locked-title{font-size:13px;font-weight:600;color:var(--accent-o);display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.checkin-locked-sub{font-size:12px;color:rgba(251,146,60,.7);line-height:1.5;}
.checkin-locked-encounters{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.enc-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,.03);border:1px solid var(--border-0);font-size:12px;}
.enc-row-name{font-weight:600;color:var(--text-0);flex:1;}
.enc-row-date{color:var(--text-2);}
.enc-row-done{color:var(--accent-g);font-weight:600;}
/* ─── CHECK-IN UI ─────────────────────────────────── */
.checkin-done-banner{display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--accent-g-dim);border:1px solid var(--accent-g-mid);border-radius:var(--radius-sm);}
.checkin-done-circle{width:44px;height:44px;border-radius:50%;background:rgba(74,222,128,.2);border:2px solid var(--accent-g);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.checkin-done-label{font-size:15px;font-weight:700;color:var(--accent-g);}
.checkin-done-time{font-size:12px;color:rgba(74,222,128,.7);margin-top:2px;}
.checkin-done-enc{font-size:11px;color:rgba(74,222,128,.6);margin-top:2px;}
.checkin-btn{width:100%;height:58px;background:linear-gradient(135deg,#4ADE80,#22C55E);color:#0a1f12;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all var(--transition);letter-spacing:.2px;}
.checkin-btn:hover{opacity:.9;transform:scale(1.01);}
.checkin-btn:active{transform:scale(.98);}
.checkin-btn.confirming{background:linear-gradient(135deg,#FB923C,#EA580C);color:#1a0800;}
.checkin-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.checkin-hint{font-size:11px;color:var(--text-2);text-align:center;margin-top:8px;}
.revoke-btn{width:100%;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border-1);background:transparent;color:var(--text-2);font-family:var(--font-body);font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all var(--transition);margin-top:10px;letter-spacing:.1px;}
.revoke-btn:hover{background:var(--accent-r-dim);border-color:rgba(239,68,68,.3);color:var(--accent-r);}
.revoke-btn.confirming-revoke{background:var(--accent-r-dim);border-color:rgba(239,68,68,.4);color:var(--accent-r);}
.checkin-no-foto-banner{padding:14px 16px;background:var(--accent-o-dim);border:1px solid rgba(251,146,60,.25);border-radius:var(--radius-sm);margin-bottom:12px;}
.checkin-no-foto-title{font-size:13px;font-weight:600;color:var(--accent-o);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.checkin-no-foto-sub{font-size:12px;color:rgba(251,146,60,.7);}
/* ─── FOTO SECTION ────────────────────────────────── */
.foto-container{display:flex;flex-direction:column;align-items:center;gap:14px;}
.foto-preview-wrap{width:100%;max-width:240px;aspect-ratio:1/1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-1);background:var(--bg-3);position:relative;cursor:pointer;}
.foto-preview-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.foto-preview-wrap:hover img{transform:scale(1.04);}
.foto-preview-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity var(--transition);color:#fff;font-size:12px;font-weight:500;}
.foto-preview-wrap:hover .foto-preview-overlay{opacity:1;}
.foto-empty{width:100%;max-width:240px;aspect-ratio:1/1;border-radius:var(--radius-md);border:2px dashed var(--border-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-2);font-size:13px;background:rgba(255,255,255,.02);}
.foto-empty-icon{font-size:36px;opacity:.4;}
.foto-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px;}
.foto-btn{height:44px;border-radius:var(--radius-sm);border:1px solid var(--border-1);background:var(--bg-3);color:var(--text-0);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all var(--transition);}
.foto-btn:hover{background:var(--bg-2);border-color:var(--border-2);}
/* ─── PAYMENT TOGGLE ──────────────────────────────── */
.payment-toggle{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--radius-sm);border:1px solid var(--border-1);overflow:hidden;margin-top:4px;}
.payment-opt{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text-2);background:transparent;transition:all var(--transition);border:none;font-family:var(--font-body);}
.payment-opt+.payment-opt{border-left:1px solid var(--border-1);}
.payment-opt.sel-yellow{background:var(--accent-y-dim);color:var(--accent-y);}
.payment-opt.sel-orange{background:var(--accent-o-dim);color:var(--accent-o);}
.save-btn{width:100%;height:52px;background:linear-gradient(135deg,var(--accent-y),#EAB308);color:#18181b;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;transition:opacity var(--transition),transform var(--transition);letter-spacing:.2px;}
.save-btn:hover{opacity:.9;}
.save-btn:active{transform:scale(.99);}
.save-btn:disabled{opacity:.5;cursor:not-allowed;}
/* ─── CROP MODAL ──────────────────────────────────── */
.crop-modal-content{display:flex;flex-direction:column;height:88vh;width:100%;max-width:520px;background:#000;border-radius:var(--radius-xl) var(--radius-xl) 0 0;}
@media(min-width:900px){.crop-modal-content{border-radius:var(--radius-xl);}}
.crop-area{flex:1;overflow:hidden;position:relative;background:#000;}
.crop-footer{padding:16px;background:var(--bg-1);}
/* ─── LIGHTBOX ────────────────────────────────────── */
.lightbox-bg{z-index:1500;background:rgba(0,0,0,.92);align-items:center;justify-content:center;cursor:zoom-out;}
.lightbox-content{position:relative;cursor:default;max-width:92vw;max-height:92vh;}
.lightbox-img{max-width:100%;max-height:90vh;object-fit:contain;border-radius:var(--radius-md);display:block;box-shadow:0 32px 80px rgba(0,0,0,.6);}
.lightbox-close{position:absolute;top:-16px;right:-16px;width:36px;height:36px;border-radius:50%;background:var(--bg-2);border:1px solid var(--border-1);color:var(--text-0);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
/* ─── SIDEBAR MOBILE ──────────────────────────────── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:499;}
.sidebar-overlay.open{display:block;}
@media(max-width:900px){
  .sidebar{display:flex;position:fixed;left:0;top:0;bottom:0;width:min(320px,85vw);transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:500;}
  .sidebar.mobile-open{transform:translateX(0);}
}
input[type=file]{display:none;}
.list-wrapper::-webkit-scrollbar{width:4px;}
.list-wrapper::-webkit-scrollbar-track{background:transparent;}
.list-wrapper::-webkit-scrollbar-thumb{background:var(--border-0);border-radius:2px;}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg-2);border:1px solid var(--border-1);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:500;color:var(--text-0);z-index:9999;transition:transform .3s cubic-bezier(.4,0,.2,1);white-space:nowrap;box-shadow:var(--shadow-modal);pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{border-color:var(--accent-g);color:var(--accent-g);}
.toast.error{border-color:var(--accent-r);color:var(--accent-r);}
.toast.info{border-color:var(--accent-y);color:var(--accent-y);}
</style>
</head>

  <!-- ─── SIDEBAR ─────────────────── -->

    <div class="mobile-stats">
      <div class="mobile-stat">
        <div class="mobile-stat-label">Total</div>
        <div class="mobile-stat-number" id="mTotal">—</div>
      </div>
      <div class="mobile-stat">
        <div class="mobile-stat-label">Pagos</div>
        <div class="mobile-stat-number yellow" id="mPagos">—</div>
      </div>
      <div class="mobile-stat">
        <div class="mobile-stat-label">Pendentes</div>
        <div class="mobile-stat-number orange" id="mPend">—</div>
      </div>
      <div class="mobile-stat">
        <div class="mobile-stat-label">Com foto</div>
        <div class="mobile-stat-number" id="mFoto">—</div>

      <div class="mobile-stat" style="border-color:rgba(74,222,128,.2);">

    <div class="mobile-search">

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwX87QCGUQg6jO5Cx1R-TZAY8_-W9q6e2YwX4ZWdJHHWjDkdhsP5JVXVBrM3Yb1MUE-/exec";

// ============================================================
// STATE
// ============================================================
let dados = [], filtrados = [];
let iP = 18, iF = 19;
let rowAtual = -1;
let filtroAtivo = null;
let fotoNovaBase64 = null, fotoNovoMime = null, fotoNovoNome = null;
let cropper = null;
let _pagoSelecionado = true;
let _checkinConfirmStep = false;
let _checkinTimer = null;
let _revogarConfirmStep = false;
let _revogarTimer = null;

// ─── Encontros ───────────────────────────────────────────────
let encontros = [];        // [{nome, data}] — dados da aba Encontros
let encontroAtivo = null;  // {nome, data, colKey} ou null
// "colKey" = nome da coluna na aba principal: "Checkin_<NomeEncontro>"

// ============================================================
// UTILS
// ============================================================
function initials(n) {
  const p = (n || "?").trim().split(" ");
  return p.length >= 2 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : (p[0][0]||"?").toUpperCase();
}

function fixDriveUrl(url) {
  if (!url || !url.trim()) return "";
  url = url.trim();
  if (url.includes("lh3.googleusercontent.com")) return url;
  let id = null;
  const m1 = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  if (m1) id = m1[1];
  if (!id) { const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/); if (m2) id = m2[1]; }
  if (id) return `https://lh3.googleusercontent.com/d/${id}`;
  return url;
}

function fmtTimestamp() {
  return new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

/**
 * Converte string "DD/MM/YYYY" em objeto Date (meia-noite local).
 */
function parseDate(str) {
  if (!str) return null;
  str = str.trim();
  // Aceita DD/MM/YYYY ou DD-MM-YYYY
  const parts = str.split(/[\/\-]/);
  if (parts.length === 3) {
    const d = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10) - 1;
    const y = parseInt(parts[2], 10);
    const dt = new Date(y, m, d);
    if (!isNaN(dt.getTime())) return dt;
  }
  // Fallback: tenta parse direto
  const dt = new Date(str);
  return isNaN(dt.getTime()) ? null : dt;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth()    === b.getMonth()    &&
         a.getDate()     === b.getDate();
}

/**
 * Dado o array de cabeçalhos da planilha, retorna o índice da coluna
 * de check-in do encontroAtivo (ou -1).
 */
function getCiColIndex(headers) {
  if (!encontroAtivo) return -1;
  const colKey = "Checkin_" + encontroAtivo.nome;
  const idx = headers.indexOf(colKey);
  return idx; // -1 se ainda não criada
}

/**
 * Retorna o valor de check-in do encontro ativo para uma linha.
 */
function getCheckinValue(row) {
  if (!encontroAtivo || !row._ciIdx || row._ciIdx < 0) return "";
  return row[row._ciIdx] || "";
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type="") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove("show"), 3200);
}

// ============================================================
// SIDEBAR MOBILE
// ============================================================
function openSidebar() {
  document.getElementById("sidebar").classList.add("mobile-open");
  document.getElementById("sidebarOverlay").classList.add("open");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("mobile-open");
  document.getElementById("sidebarOverlay").classList.remove("open");
}

// ============================================================
// LOAD DATA
// ============================================================
async function carregarDados() {
  document.getElementById("lista").innerHTML = `<div class="loading"><div class="loading-spinner"></div>Carregando dados da planilha…</div>`;
  try {
    const res = await fetch(API_URL);
    const json = await res.text();
    renderizar(json);
  } catch(err) {
    console.error(err);
    document.getElementById("lista").innerHTML = `<div class="empty">Erro de conexão. Tente novamente.</div>`;
  }
}

function renderizar(json) {
  const payload = JSON.parse(json);

  // Suporte legado (array puro) e novo formato {inscricoes, encontros}
  let rawData, rawEncontros;
  if (Array.isArray(payload)) {
    rawData = payload;
    rawEncontros = [];
  } else {
    rawData = payload.inscricoes || [];
    rawEncontros = payload.encontros || [];
  }

  encontros = rawEncontros;
  resolverEncontroAtivo();

  const headers = rawData[0] || [];
  iP = headers.indexOf("PAGO");
  iF = headers.indexOf("Foto");
  // iCI será resolvido por linha via encontroAtivo
  const ciIdx = getCiColIndex(headers);

  dados = rawData.slice(1).map(row => {
    // Anexa índice da coluna de CI diretamente na linha para acesso rápido
    row._ciIdx = ciIdx;
    return row;
  });

  filtrados = [...dados];
  atualizarStats();
  atualizarBannerEncontro();
  renderLista();
}

// ============================================================
// RESOLVER ENCONTRO ATIVO
// ============================================================
function resolverEncontroAtivo() {
  const hoje = new Date();
  encontroAtivo = null;

  for (const enc of encontros) {
    const dt = parseDate(enc.data);
    if (dt && isSameDay(dt, hoje)) {
      encontroAtivo = {
        nome: enc.nome,
        data: enc.data,
        colKey: "Checkin_" + enc.nome
      };
      break;
    }
  }
}

// ============================================================
// BANNER DE ENCONTRO
// ============================================================
function atualizarBannerEncontro() {
  const banner = document.getElementById("encontroBanner");
  const dot    = document.getElementById("encontroDot");
  const name   = document.getElementById("encontroName");
  const meta   = document.getElementById("encontroMeta");
  const sideBox= document.getElementById("sidebarEncontroBox");
  const sPresLbl = document.getElementById("sPresLbl");

  banner.style.display = "flex";

  if (encontroAtivo) {
    banner.className = "encontro-banner active";
    dot.className    = "encontro-dot active";
    name.className   = "encontro-name active";
    name.textContent = encontroAtivo.nome;
    meta.textContent = `Encontro de hoje · ${encontroAtivo.data} · Check-in habilitado`;
    sPresLbl.textContent = `Presentes — ${encontroAtivo.nome}`;

    sideBox.style.display = "";
    sideBox.className = "sidebar-encontro enc-active";
    sideBox.innerHTML = `
      <div class="sidebar-enc-label active">Encontro hoje</div>
      <div class="sidebar-enc-name">${encontroAtivo.nome}</div>
      <div class="sidebar-enc-date">${encontroAtivo.data}</div>`;
  } else if (encontros.length > 0) {
    banner.className = "encontro-banner inactive";
    dot.className    = "encontro-dot inactive";
    name.className   = "encontro-name inactive";

    // Próximo encontro
    const hoje = new Date();
    const futuros = encontros
      .map(e => ({ ...e, dt: parseDate(e.data) }))
      .filter(e => e.dt && e.dt > hoje)
      .sort((a,b) => a.dt - b.dt);

    if (futuros.length > 0) {
      const prox = futuros[0];
      name.textContent = `Próximo: ${prox.nome}`;
      meta.textContent = `${prox.data} · Check-in indisponível fora da data`;
    } else {
      name.textContent = "Nenhum encontro hoje";
      meta.textContent = "Check-in desabilitado · Adicione encontros na aba Encontros";
    }
    sPresLbl.textContent = "Presentes — Check-in";

    sideBox.style.display = "";
    sideBox.className = "sidebar-encontro enc-inactive";
    sideBox.innerHTML = `
      <div class="sidebar-enc-label inactive">Sem encontro hoje</div>
      <div class="sidebar-enc-name" style="color:var(--text-1)">${futuros.length > 0 ? 'Próximo: '+futuros[0].nome : 'Nenhum agendado'}</div>
      <div class="sidebar-enc-date">${futuros.length > 0 ? futuros[0].data : ''}</div>`;
  } else {
    banner.className = "encontro-banner none";
    dot.className    = "encontro-dot none";
    name.className   = "encontro-name none";
    name.textContent = "Aba \"Encontros\" não configurada";
    meta.textContent = "Crie a aba com colunas Nome e DataInicio na planilha";
    sideBox.style.display = "none";
    sPresLbl.textContent = "Presentes — Check-in";
  }
}

// ============================================================
// STATS
// ============================================================
function atualizarStats() {
  const t = dados.length;
  const pg = dados.filter(r => (r[iP]||"").toUpperCase() === "SIM").length;
  const cf = dados.filter(r => r[iF] && r[iF].trim()).length;
  const pres = dados.filter(r => {
    const ci = r._ciIdx >= 0 ? (r[r._ciIdx] || "") : "";
    return ci.trim().length > 0;
  }).length;

  document.getElementById("sTotal").textContent = t;
  document.getElementById("sPagos").textContent = pg;
  document.getElementById("sPend").textContent = t - pg;
  document.getElementById("sFoto").textContent = cf;
  document.getElementById("sPresentes").textContent = encontroAtivo ? pres : "—";
  document.getElementById("mTotal").textContent = t;
  document.getElementById("mPagos").textContent = pg;
  document.getElementById("mPend").textContent = t - pg;
  document.getElementById("mFoto").textContent = cf;
  document.getElementById("mPresentes").textContent = encontroAtivo ? pres : "—";
}

// ============================================================
// FILTER
// ============================================================
function toggleFiltro(tipo) {
  filtroAtivo = filtroAtivo === tipo ? null : tipo;
  ["chipCheckin","chipPago","chipPend","chipFoto","chipMed","chipRest"].forEach(id => {
    document.getElementById(id).className = "filter-chip";
  });
  if (filtroAtivo === "checkin") document.getElementById("chipCheckin").className = "filter-chip active-green";
  if (filtroAtivo === "pago")    document.getElementById("chipPago").className    = "filter-chip active-yellow";
  if (filtroAtivo === "pend")    document.getElementById("chipPend").className    = "filter-chip active-orange";
  if (filtroAtivo === "foto")    document.getElementById("chipFoto").className    = "filter-chip active-yellow";
  if (filtroAtivo === "med")     document.getElementById("chipMed").className     = "filter-chip active-orange";
  if (filtroAtivo === "rest")    document.getElementById("chipRest").className    = "filter-chip active-red";
  filtrar();
}

function toggleFiltroMobile() {
  const order = [null, "checkin", "pend", "pago", "foto", "med", "rest"];
  let idx = order.indexOf(filtroAtivo);
  idx = (idx+1) % order.length;
  filtroAtivo = order[idx];
  const chip = document.getElementById("chipMobile");
  chip.className = "filter-chip";
  const map = { null:"Filtrar", checkin:["Presentes","active-green"], pend:["Pendente","active-orange"], pago:["Pago","active-yellow"], foto:["Com Foto","active-yellow"], med:["Medicação","active-orange"], rest:["Restrição","active-red"] };
  if (!filtroAtivo) { chip.textContent = "Filtrar"; }
  else { chip.textContent = map[filtroAtivo][0]; chip.classList.add(map[filtroAtivo][1]); }
  filtrar();
}

function filtrarMobile() {
  document.getElementById("busca").value = document.getElementById("buscaMobile").value;
  filtrar();
}

function filtrar() {
  const q = (document.getElementById("busca").value||"").toLowerCase();
  filtrados = dados.filter(r => {
    const n = (r[2]||"").toLowerCase(), e = (r[1]||"").toLowerCase();
    const mq = !q || n.includes(q) || e.includes(q);
    const pago = (r[iP]||"").toUpperCase() === "SIM";
    const foto = !!(r[iF] && r[iF].trim());
    const rest = (r[7]||"").toLowerCase().includes("sim");
    const med  = (r[9]||"").toLowerCase().includes("sim");
    const ci   = r._ciIdx >= 0 ? !!(r[r._ciIdx] && r[r._ciIdx].trim()) : false;
    let mp = true;
    if (filtroAtivo === "checkin") mp = ci;
    if (filtroAtivo === "pago")    mp = pago;
    if (filtroAtivo === "pend")    mp = !pago;
    if (filtroAtivo === "foto")    mp = foto;
    if (filtroAtivo === "med")     mp = med;
    if (filtroAtivo === "rest")    mp = rest;
    return mq && mp;
  });
  document.getElementById("sCount").textContent = filtrados.length;
  renderLista();
}

// ============================================================
// RENDER LIST
// ============================================================
function renderLista() {
  document.getElementById("sCount").textContent = filtrados.length;
  if (!filtrados.length) {
    document.getElementById("lista").innerHTML = `<div class="empty">Nenhum participante encontrado.</div>`;
    return;
  }
  let html = "";
  filtrados.forEach(row => {
    const ri = dados.indexOf(row);
    const nome   = row[2] || "—";
    const email  = row[1] || "";
    const nasc   = row[4] || "—";
    const resp   = row[5] || "—";
    const pago   = (row[iP]||"").toUpperCase() === "SIM";
    const fotoRaw= row[iF] || "";
    const foto   = fixDriveUrl(fotoRaw);
    const rest   = (row[7]||"").toLowerCase().includes("sim");
    const med    = (row[9]||"").toLowerCase().includes("sim");

    // Check-in do encontro ativo
    const ciVal = row._ciIdx >= 0 ? (row[row._ciIdx] || "") : "";
    const checkin = ciVal.trim().length > 0;

    const ini = initials(nome);

    const pgChip = pago
      ? `<span class="chip chip-yellow"><span class="dot dot-y"></span>Pago</span>`
      : `<span class="chip chip-orange"><span class="dot dot-o"></span>Pendente</span>`;
    const rChip = rest ? `<span class="chip chip-red">Restrição</span>` : "";
    const mChip = med  ? `<span class="chip chip-orange">Medicação</span>` : "";
    const ciChip= checkin && encontroAtivo ? `<span class="chip chip-green"><span class="dot dot-g"></span>Presente</span>` : "";

    const avInner = foto
      ? `<img src="${foto}" onerror="this.onerror=null;this.parentElement.innerHTML='<span>${ini}</span>'"><div class="photo-overlay">🔍</div>`
      : `<span>${ini}</span>`;

    // Card quick check-in action
    let ciAction = "";
    if (!encontroAtivo) {
      // Sem encontro hoje — mostra cadeado
      ciAction = `<button class="ci-action ci-locked" title="Sem encontro hoje" disabled>🔒</button><div class="ci-label">Inativo</div>`;
    } else if (checkin) {
      ciAction = `<button class="ci-action ci-done" title="Presente — toque para abrir e revogar" onclick="event.stopPropagation();abrirModal(${ri})">✓</button><div class="ci-label" style="color:var(--accent-g)">Presente</div>`;
    } else if (foto) {
      ciAction = `<button class="ci-action ci-ready" title="Realizar check-in" onclick="event.stopPropagation();quickCheckin(${ri})">✔</button><div class="ci-label">Check-in</div>`;
    } else {
      ciAction = `<button class="ci-action ci-nofoto" title="Foto necessária para check-in" onclick="event.stopPropagation();abrirModal(${ri})">📷</button><div class="ci-label">Foto<br>neces.</div>`;
    }

    html += `
      <div class="card ${checkin && encontroAtivo ? 'card-checkedin' : ''}" onclick="abrirModal(${ri})">
        <div class="card-inner">
          <div class="avatar ${checkin && encontroAtivo ? 'avatar-checkedin' : ''}" onclick="event.stopPropagation();${foto ? `verFoto('${foto}')` : ''}" title="${foto ? 'Ver foto' : nome}">
            ${avInner}
          </div>
          <div class="card-info">
            <div class="card-name">${nome}</div>
            <div class="card-email">${email}</div>
            <div class="card-chips">${pgChip}${ciChip}${rChip}${mChip}</div>
          </div>
          <div class="card-checkin-zone">${ciAction}</div>
        </div>
        <div class="card-footer">
          <span class="card-footer-lbl">Nasc.</span>
          <span class="card-footer-val">${nasc}</span>
          <span class="card-footer-sep">|</span>
          <span class="card-footer-lbl">Resp.</span>
          <span class="card-footer-val" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${resp}</span>
        </div>
      </div>`;
  });
  document.getElementById("lista").innerHTML = html;
}

// ============================================================
// QUICK CHECK-IN (from card)
// ============================================================
async function quickCheckin(ri) {
  if (!encontroAtivo) {
    showToast("Sem encontro ativo hoje. Check-in bloqueado.", "error");
    return;
  }
  const row = dados[ri];
  const nome = row[2] || "?";
  const foto = fixDriveUrl(row[iF] || "");

  if (!foto) {
    showToast("Adicione uma foto antes do check-in.", "error");
    return;
  }
  if (row._ciIdx >= 0 && row[row._ciIdx] && row[row._ciIdx].trim()) {
    showToast(`${nome} já está com check-in realizado.`, "info");
    return;
  }
  const ts = fmtTimestamp();

  // Se coluna ainda não existe localmente, a referenciamos via _ciIdx
  if (row._ciIdx >= 0) {
    dados[ri][row._ciIdx] = ts;
  }

  renderLista();
  atualizarStats();
  showToast(`Check-in de ${nome} realizado! ✓`, "success");

  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        rowIndex: ri,
        checkin: ts,
        encontroNome: encontroAtivo.nome
      })
    });
  } catch(err) {
    console.error("Erro ao salvar check-in:", err);
  }
}

}
function fecharLightbox() {

}

        <div class="foto-preview-overlay"><span style="font-size:28px">🔍</span><span>Ver foto completa</span></div>

function fecharModal() {
  document.getElementById("modalBg").classList.remove("open");
  _checkinConfirmStep = false;
  _revogarConfirmStep = false;
  if (_checkinTimer) { clearTimeout(_checkinTimer); _checkinTimer = null; }
  if (_revogarTimer) { clearTimeout(_revogarTimer); _revogarTimer = null; }
}

function setPago(v) {
  _pagoSelecionado = v;
  document.getElementById("optPago").className = "payment-opt " + (v ? "sel-yellow" : "");
  document.getElementById("optPend").className = "payment-opt " + (v ? "" : "sel-orange");
}

// ============================================================
// CHECK-IN MODAL — Double-tap confirmation
// ============================================================
function iniciarCheckinModal() {
  if (!encontroAtivo) {
    showToast("Sem encontro ativo hoje. Check-in bloqueado.", "error");
    return;
  }
  const row = dados[rowAtual];
  const foto = fixDriveUrl(row[iF] || "");

  if (!foto && !fotoNovaBase64) {
    showToast("Adicione e salve uma foto primeiro!", "error");
    return;
  }

  const btn = document.getElementById("checkinModalBtn");
  const hint = document.getElementById("checkinHint");
  if (!btn) return;

  if (!_checkinConfirmStep) {
    _checkinConfirmStep = true;
    btn.classList.add("confirming");
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Confirmar presença?`;
    if (hint) hint.textContent = "Toque novamente para confirmar o check-in.";

    _checkinTimer = setTimeout(() => {
      _checkinConfirmStep = false;
      if (!btn) return;
      btn.classList.remove("confirming");
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Realizar Check-in — ${encontroAtivo.nome}`;
      if (hint) hint.textContent = `Toque para confirmar a presença de ${row[2] || ""}`;
    }, 4000);
  } else {
    clearTimeout(_checkinTimer);
    _checkinTimer = null;
    _checkinConfirmStep = false;
    confirmarCheckinModal();
  }
}

async function confirmarCheckinModal() {
  const btn = document.getElementById("checkinModalBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Salvando…"; }

  const ts = fmtTimestamp();
  const row = dados[rowAtual];
  if (row._ciIdx >= 0) {
    dados[rowAtual][row._ciIdx] = ts;
  }
  atualizarStats();
  renderLista();

  const body = document.getElementById("checkinSectionBody");
  if (body) {
    body.innerHTML = `
      <div class="checkin-done-banner">
        <div class="checkin-done-circle">✓</div>
        <div>
          <div class="checkin-done-label">Presente no encontro!</div>
          <div class="checkin-done-enc">${encontroAtivo.nome}</div>
          <div class="checkin-done-time">Registrado em ${ts}</div>
        </div>
      </div>
      <button class="revoke-btn" id="revokeBtn" onclick="iniciarRevogarCheckin()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Revogar check-in
      </button>`;
  }

  showToast(`Check-in de ${row[2]||"?"} realizado! ✓`, "success");

  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        rowIndex: rowAtual,
        checkin: ts,
        encontroNome: encontroAtivo.nome
      })
    });
  } catch(err) {
    console.error("Erro ao salvar check-in:", err);
  }
}

// ============================================================
// REVOGAR CHECK-IN
// ============================================================
function iniciarRevogarCheckin() {
  const btn = document.getElementById("revokeBtn");
  if (!btn) return;

  if (!_revogarConfirmStep) {
    _revogarConfirmStep = true;
    btn.classList.add("confirming-revoke");
    btn.innerHTML = `
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Confirmar revogação?`;

    _revogarTimer = setTimeout(() => {
      _revogarConfirmStep = false;
      if (!btn) return;
      btn.classList.remove("confirming-revoke");
      btn.innerHTML = `
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Revogar check-in`;
    }, 4000);
  } else {
    clearTimeout(_revogarTimer);
    _revogarTimer = null;
    _revogarConfirmStep = false;
    confirmarRevogarCheckin();
  }
}

async function confirmarRevogarCheckin() {
  const btn = document.getElementById("revokeBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Revogando…"; }

  const nome = dados[rowAtual][2] || "?";
  const row = dados[rowAtual];
  if (row._ciIdx >= 0) {
    dados[rowAtual][row._ciIdx] = "";
  }
  atualizarStats();
  renderLista();

  const body = document.getElementById("checkinSectionBody");
  if (body && encontroAtivo) {
    body.innerHTML = `
      <div style="font-size:12px;color:var(--accent-o);background:var(--accent-o-dim);border:1px solid rgba(251,146,60,.25);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Check-in revogado.
      </div>
      <button class="checkin-btn" id="checkinModalBtn" onclick="iniciarCheckinModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        Realizar Check-in — ${encontroAtivo.nome}
      </button>
      <div class="checkin-hint" id="checkinHint">Toque para confirmar a presença de ${nome}</div>`;
  }

  showToast(`Check-in de ${nome} revogado.`, "");

  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        rowIndex: rowAtual,
        checkin: "",
        encontroNome: encontroAtivo.nome
      })
    });
  } catch(err) {
    console.error("Erro ao revogar check-in:", err);
  }
}

// ============================================================
// FOTO — CROP
// ============================================================
function abrirGaleria() { document.getElementById("inputFotoGaleria").click(); }
function abrirCamera()  { document.getElementById("inputFotoCamera").click(); }

function processarFoto(file) {
  if (!file) return;
  fotoNovoMime = file.type;
  fotoNovoNome = file.name;
  const reader = new FileReader();
  reader.onloadend = e => {
    document.getElementById("imageToCrop").src = e.target.result;
    document.getElementById("cropModalBg").classList.add("open");
    if (cropper) cropper.destroy();
    cropper = new Cropper(document.getElementById("imageToCrop"), {
      aspectRatio: 1, viewMode: 1, zoomable: true, dragMode: "move",
      autoCropArea: 1, guides: true, cropBoxMovable: true, cropBoxResizable: true,
      toggleDragModeOnDblclick: false,
    });
  };
  reader.readAsDataURL(file);
}

function fecharCrop() {
  document.getElementById("cropModalBg").classList.remove("open");
  if (cropper) { cropper.destroy(); cropper = null; }
}

function aplicarCrop() {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width:800, height:800 });
  fotoNovaBase64 = canvas.toDataURL(fotoNovoMime||"image/jpeg", 0.9);

  const container = document.querySelector("#mBody .foto-container");
  if (container) {
    const oldPreview = container.querySelector(".foto-preview-wrap");
    const oldEmpty = container.querySelector(".foto-empty");
    if (oldPreview) oldPreview.remove();
    if (oldEmpty) oldEmpty.remove();
    const wrap = document.createElement("div");
    wrap.className = "foto-preview-wrap";
    wrap.title = "Clique para ampliar";
    wrap.onclick = () => verFoto(fotoNovaBase64);
    wrap.innerHTML = `<img id="fotoAtual" src="${fotoNovaBase64}"><div class="foto-preview-overlay"><span style="font-size:28px">🔍</span><span>Ver foto completa</span></div>`;
    const actions = container.querySelector(".foto-actions");
    container.insertBefore(wrap, actions);
  }

  const av = document.getElementById("mAvatar");
  av.innerHTML = `<img src="${fotoNovaBase64}">`;

  // Habilita check-in se encontro ativo e sem check-in
  if (encontroAtivo) {
    const row = dados[rowAtual];
    const ciVal = row._ciIdx >= 0 ? (row[row._ciIdx] || "") : "";
    const temCheckin = ciVal.trim().length > 0;
    if (!temCheckin) {
      const ciBody = document.getElementById("checkinSectionBody");
      if (ciBody) {
        const nome = row[2] || "";
        ciBody.innerHTML = `
          <div style="font-size:12px;color:var(--accent-g);background:var(--accent-g-dim);border:1px solid var(--accent-g-mid);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;">
            ✓ Foto adicionada — salve para liberar o check-in permanentemente.
          </div>
          <button class="checkin-btn" id="checkinModalBtn" onclick="iniciarCheckinModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
            Realizar Check-in — ${encontroAtivo.nome}
          </button>
          <div class="checkin-hint" id="checkinHint">Toque para confirmar a presença de ${nome}</div>`;
      }
    }
  }

  fecharCrop();
  showToast("Foto recortada! Clique em Salvar para enviar.", "info");
}

document.getElementById("inputFotoGaleria").addEventListener("change", function() { processarFoto(this.files[0]); this.value=""; });
document.getElementById("inputFotoCamera").addEventListener("change", function() { processarFoto(this.files[0]); this.value=""; });

// ============================================================
// SAVE
// ============================================================
async function salvar() {
  const btn = document.getElementById("saveBtn");
  btn.textContent = "Salvando…";
  btn.disabled = true;

  const payload = {
    rowIndex: rowAtual,
    pago: _pagoSelecionado ? "SIM" : "NÃO",
    fotoBase64: fotoNovaBase64,
    mimeType: fotoNovoMime,
    nomeArquivo: fotoNovoNome
  };

  try {
    await fetch(API_URL, { method:"POST", body: JSON.stringify(payload) });
    showToast("Salvo com sucesso! ✓", "success");
    setTimeout(() => { fecharModal(); carregarDados(); }, 600);
  } catch(err) {
    console.error(err);
    showToast("Erro ao salvar. Tente novamente.", "error");
    btn.textContent = "Tentar novamente";
    btn.disabled = false;
  }
}

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    fecharLightbox(); fecharModal(); fecharCrop(); closeSidebar();
  }
});

// ============================================================
// BLOQUEIO DE ZOOM NO IOS
// ============================================================
document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);

// ============================================================
// INIT
// ============================================================
carregarDados();
</script>
</body>
